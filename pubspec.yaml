name: eigenapp_fuer_ios
description: "Homelab Hub & Sensor-App für iOS (Flutter)"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  battery_plus: ^7.1.2
  connectivity_plus: ^7.3.1
  cupertino_icons: ^2.0.0
  device_info_plus: ^13.3.0
  flutter:
    sdk: flutter
  flutter_inappwebview: ^6.2.0-beta.3
  geolocator: ^14.1.2
  http: ^1.6.0
  network_info_plus: ^8.2.1
  pedometer: ^4.2.0
  provider: ^6.1.5+1
  screen_brightness: ^2.1.11
  sensors_plus: ^7.1.1
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
