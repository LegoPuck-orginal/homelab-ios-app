name: Flutter iOS Build & Analyze

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    name: Flutter Analyze & iOS Build
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Analyze Dart Code
        run: flutter analyze

      - name: Build iOS Application (Simulator / No CodeSign)
        run: flutter build ios --no-codesign --simulator

      - name: Upload iOS App Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Runner-iOS-Simulator
          path: build/ios/iphonesimulator/Runner.app
