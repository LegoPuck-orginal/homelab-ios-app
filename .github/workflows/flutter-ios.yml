name: Flutter iOS Build & Sideload Release

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Sideload IPA & Analyze
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Analyze Dart Code
        run: flutter analyze

      - name: Build iOS Release App (Device / No CodeSign)
        run: flutter build ios --no-codesign --release

      - name: Package Unsigned IPA for Sideloading
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -qr homelab-core.ipa Payload
          ls -lh homelab-core.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: homelab-core-ipa
          path: homelab-core.ipa

      - name: Publish Sideload Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/master'
        with:
          tag_name: latest
          name: "Homelab Core iOS (Latest Sideload Build)"
          body: |
            ### 📱 Homelab Core iOS - Sideload Release
            Diese `.ipa`-Datei ist bereit für die Installation über **SideStore**, **Sideloadly** oder **AltStore**.
            
            * **Design**: Adobe OLED True Black (`#000000`) & Adobe Orange (`#FF7A00`)
            * **Sensoren**: Akku, CoreMotion (Gyro, Beschleunigung), Pedometer, GPS, Netzwerk, Helligkeit
            * **Dienste**: Proxmox VE, Home Assistant, Open WebUI, Jellyfin, Pi-hole u.v.m.
          files: homelab-core.ipa
